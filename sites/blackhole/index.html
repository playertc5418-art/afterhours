<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050508"><meta name="description" content="越过光的边界。一个可以自由探索的实时黑洞。"><title>奇点 · SINGULARITY</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050508'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%23eeb57d' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23050508' stroke='%23ffe1b0'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head><body>
<canvas id="universe" aria-label="动态黑洞。拖动旋转视角，滚轮或双指缩放。"></canvas>
<div class="frame"><header class="top"><div class="brand">SINGULARITY<small>奇 点 · 光 的 尽 头</small></div><div class="actions">
<button id="sound" class="icon active" title="关闭氛围音" aria-label="关闭氛围音" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4zM16 9c2 1 2 5 0 6m3-9c4 3 4 9 0 12"/></svg></button>
<button id="settings" class="icon" title="画面调节" aria-label="画面调节" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg></button>
<button id="immersive" class="icon" title="沉浸模式 · H" aria-label="沉浸模式"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
</div></header>
<section id="panel" class="panel" aria-label="画面设置"><label for="speed">天体流速 <output id="speedValue">1.0×</output></label><input id="speed" type="range" min="0" max="2.5" step="0.1" value="1"><label for="exposure">光芒强度 <output id="exposureValue">100%</output></label><input id="exposure" type="range" min=".5" max="1.8" step=".05" value="1"><label for="volume">音量 <output id="volumeValue">60%</output></label><input id="volume" type="range" min="0" max="1" step=".05" value=".6"><button id="reset" class="reset">回到最佳视角</button><div class="palette"><button class="active" data-palette="0">鎏金</button><button data-palette="1">冰蓝</button><button data-palette="2">赤焰</button></div><p class="footnote">受 NASA 与《星际穿越》启发的艺术可视化，采用近似光线弯曲。<br><a href="https://www.nasa.gov/universe/nasa-visualization-shows-a-black-holes-warped-world/" target="_blank" rel="noopener">查看视觉参考</a> · <a href="./audio/credits.html" target="_blank" rel="noopener">声音来源</a></p></section>
<footer class="bottom"><div class="caption"><strong>越过光的边界</strong><span id="hint">拖动探索 · 滚轮 / 双指缩放</span></div><nav class="controls" aria-label="观测模式"><button id="orbit" class="active" aria-pressed="true">自由观测</button><button id="cinema" aria-pressed="false">电影巡航</button><button id="dive" aria-pressed="false">迫近视界</button><button id="pause" aria-label="暂停时间" title="暂停时间" aria-pressed="false">Ⅱ</button></nav><div class="rightnote"><span class="key">SPACE</span>暂停时间<br><span class="key">H</span>隐藏界面</div></footer></div>
<button id="reveal" class="icon reveal" aria-label="退出沉浸模式" title="退出沉浸模式"><svg viewBox="0 0 24 24"><path d="M8 3v5H3m13-5v5h5M3 16h5v5m13-5h-5v5"/></svg></button><div id="toast" class="toast" role="status"></div><div id="loading"><b>SINGULARITY</b><span>正在接近光的边界</span><div class="progress"></div></div><div id="error" hidden role="alert"><h1 id="errorTitle">星空暂时无法呈现</h1><p id="errorText">请重试或重新载入。</p><div><button id="retry">重新尝试</button><button id="reload">重新载入</button></div></div>
